[project]
name = "study-notes-assistant"
version = "0.1.0"
dependencies = [
    "streamlit",
    "pypdf",
    "python-dotenv",
    "google-generativeai",
    "openai-agents>=0.6.1",
]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agents", "backend", "ui"]
